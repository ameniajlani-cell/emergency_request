<div class="map-widget">
    <div id="map-container" style="width: 100%; height: 400px; border: 1px solid #ddd; border-radius: 4px; margin-bottom: 10px;"></div>
    <p class="text-muted small">Click on the map to select the location</p>
    <input type="hidden" name="{{ widget.name }}_lat" id="id_map_latitude" value="{{ widget.lat }}">
    <input type="hidden" name="{{ widget.name }}_lng" id="id_map_longitude" value="{{ widget.lng }}">
    <div id="location-info" class="alert alert-info d-none">
        <strong>Selected Location:</strong> <span id="location-coords"></span>
    </div>
</div>
