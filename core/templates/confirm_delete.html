{% extends 'base.html' %}

{% block title %}Delete {{ object_name }}{% endblock %}

{% block content %}
<section class="tool-card p-4 p-lg-5">
    <div class="section-title">
        <i class="bi bi-exclamation-triangle"></i>
        <span>Confirm Delete</span>
    </div>
    <h1 class="h3 fw-bold">Delete {{ object_name }}?</h1>
    <p class="text-secondary mb-4">This action will remove <strong>{{ object }}</strong> if no protected records depend on it.</p>

    <form method="POST" class="d-flex flex-column flex-sm-row justify-content-end gap-2">
        {% csrf_token %}
        <a class="btn btn-outline-secondary" href="{{ cancel_url }}">
            <i class="bi bi-arrow-left"></i>
            Cancel
        </a>
        <button class="btn btn-danger" type="submit">
            <i class="bi bi-trash"></i>
            Delete
        </button>
    </form>
</section>
{% endblock %}
